---
- name: Upgrade rpm-ostree hosts safely
  hosts: ostree
  become: yes
  serial: 1

  tasks:
    - name: Get rpm-ostree status
      ansible.builtin.command: rpm-ostree status --json
      register: ostree_status
      changed_when: false

    - name: Parse status JSON
      ansible.builtin.set_fact:
        ostree_data: "{{ ostree_status.stdout | from_json }}"

    - name: Set deployment facts
      ansible.builtin.set_fact:
        booted_deployment: "{{ ostree_data.deployments | selectattr('booted', 'equalto', true) | list | first }}"
        top_deployment: "{{ ostree_data.deployments | first }}"
        pending_deployment: "{{ ostree_data.deployments | selectattr('booted', 'equalto', false) | list | first | default({}) }}"

    - name: Determine whether reboot is pending
      ansible.builtin.set_fact:
        reboot_pending: "{{ pending_deployment | length > 0 and booted_deployment.checksum != top_deployment.checksum }}"

    - name: Reboot if a pending deployment exists
      ansible.builtin.reboot:
        reboot_timeout: 1800
        connect_timeout: 10
        test_command: whoami
        post_reboot_delay: 15
      when: reboot_pending

    - name: Upgrade system
      ansible.builtin.command: rpm-ostree upgrade
      register: ostree_upgrade
      changed_when: "'No upgrade available' not in ostree_upgrade.stdout"
      when: not reboot_pending

    - name: Reboot if upgrade was applied
      ansible.builtin.reboot:
        reboot_timeout: 1800
        connect_timeout: 10
        test_command: whoami
        post_reboot_delay: 15
      when: not reboot_pending and ostree_upgrade.changed
